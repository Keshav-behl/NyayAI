databases:
  - name: nyayai-postgres
    plan: free
    databaseName: nyayai_db
    user: nyayai_user

services:
  - type: web
    name: nyayai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nyayai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Comma-separated list of allowed frontend origins (local dev + Vercel prod).
      # Update after Phase 8 with the deployed Vercel URL.
      - key: FRONTEND_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: LOG_LEVEL
        value: info
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: nyayai-legal
      - key: PINECONE_HOST
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1.5
      - key: ANTHROPIC_API_KEY
        sync: false
