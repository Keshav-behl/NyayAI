version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nyayai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyayai_user
      POSTGRES_PASSWORD: nyayai_password
      POSTGRES_DB: nyayai_db
    ports:
      - '5433:5432'
    volumes:
      - nyayai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nyayai_user -d nyayai_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nyayai_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nyayai.in
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  nyayai_pg_data: